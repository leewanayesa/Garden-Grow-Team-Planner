<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3a20">
<meta name="robots" content="noindex">
<title>Garden Grow · Villas done</title>
<style>
:root{--bg:#f3f6f1;--surface:#fff;--ink:#1d2a20;--muted:#5d6b60;--line:#d9e2d6;--green:#2e7d32;--gsoft:#e6f2e5;--forest:#0f3a20;--red:#b3261e;--rsoft:#fbe9e7;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111713;--surface:#1a221c;--ink:#e7efe6;--muted:#a2b4a6;--line:#2d3a30;--green:#6cc070;--gsoft:#1f3322;--forest:#0b2615;--red:#ef8a80;--rsoft:#3a1d1a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:120px}
header{background:var(--forest);color:#fff;padding:18px 16px 20px}
header b{display:block;font-size:1.4rem}
header span{color:#cfe5cf;font-size:.95rem}
main{padding:14px 16px;display:grid;gap:10px;max-width:560px;margin:0 auto}
.help{font-size:.95rem;color:var(--muted)}
.area{font-size:.78rem;font-weight:800;letter-spacing:.06em;color:var(--green);text-transform:uppercase;margin-top:6px}
.v{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;border:2px solid var(--green);border-radius:14px;background:var(--gsoft);color:var(--ink);font:inherit;text-align:left;padding:8px 12px;cursor:pointer}
.v i{width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:900;flex:none}
.v span{flex:1;font-weight:700}
.v em{font-style:normal;font-size:.8rem;font-weight:800;color:var(--green)}
.v.no{border-color:var(--red);background:var(--rsoft)}.v.no i{background:var(--red)}.v.no em{color:var(--red)}
.fin{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:12px;border:1px solid var(--line)}
.fin input{font:inherit;font-size:1.1rem;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar button{width:100%;min-height:56px;border:0;border-radius:14px;background:#1fa855;color:#fff;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer}
.bar button:disabled{opacity:.5}
.msg{background:var(--surface);border-radius:14px;padding:18px;text-align:center;font-size:1.05rem}
.ok{color:var(--green);font-weight:800;font-size:1.3rem}
</style>
</head>
<body>
<header><b id="ttl">Garden Grow</b><span id="sub">Loading…</span></header>
<main id="main"><div class="msg">Loading…</div></main>
<div class="bar" id="bar" hidden><button id="send" type="button">Send</button></div>
<script>
const SYNC='https://script.google.com/macros/s/AKfycby4gjvvySVzFdJPSUJTphQoqDYnFIfaVdpCpyToWLRZKGnf3-Zi5dCSZ310d1L7Tr4s/exec';
const q=new URLSearchParams(location.search),D=q.get('d')||'',T=q.get('t')||'',K=q.get('k')||'';
const $=id=>document.getElementById(id), esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const nice=s=>{const [y,m,d]=s.split('-').map(Number),x=new Date(y,m-1,d);return `${DN[x.getDay()]} ${d} ${MN[m-1]}`};
const now=()=>{const x=new Date();return String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0')};
let V=[],no=new Set(),busy=false;
function draw(){
  let html='<p class="help">All villas count as <b>done</b>. Tap a villa that was <b>NOT done</b> (it turns red). It moves to the next working day.</p>',last='';
  V.forEach((v,i)=>{if(v.area!==last){html+=`<div class="area">${esc(v.area)}</div>`;last=v.area}
    const n=no.has(v.id);html+=`<button class="v ${n?'no':''}" data-i="${i}" aria-pressed="${n}"><i>${n?'✗':'✓'}</i><span>${esc(v.name)}</span><em>${n?'NOT DONE':'DONE'}</em></button>`});
  html+=`<label class="fin"><span>Finished at</span><input type="time" id="fin" value="${esc($('fin')?$('fin').value:now())}"></label>`;
  $('main').innerHTML=html;
  $('send').textContent=`Send · ${V.length-no.size} done${no.size?` · ${no.size} not done`:''}`;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;const v=V[+b.dataset.i];if(no.has(v.id))no.delete(v.id);else no.add(v.id);draw()});
$('send').onclick=async()=>{if(busy)return;busy=true;$('send').disabled=true;$('send').textContent='Sending…';
  try{const r=await fetch(SYNC,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'leaderdone',d:D,t:T,k:K,done:V.filter(v=>!no.has(v.id)).map(v=>v.id),notDone:[...no],finish:($('fin')||{}).value||''})});
    const j=await r.json();if(!j.ok)throw new Error(j.error||'not saved');
    $('bar').hidden=true;$('main').innerHTML=`<div class="msg"><div class="ok">✓ Sent — thank you</div><p>${V.length-no.size} done${no.size?` · ${no.size} not done (moved to the next working day)`:''}</p><p class="help">You can open this link again to change it.</p></div>`}
  catch(e){alert('Not sent — check the internet and try again.\n('+e.message+')');$('send').disabled=false;draw()}
  busy=false};
(async()=>{
  if(!D||!T||!K){$('sub').textContent='This link is not complete.';$('main').innerHTML='<div class="msg">Open the link from the WhatsApp message.</div>';return}
  try{const j=await fetch(`${SYNC}?action=leaderday&d=${encodeURIComponent(D)}&t=${encodeURIComponent(T)}&k=${encodeURIComponent(K)}&_=${Date.now()}`).then(r=>r.json());
    if(!j.ok)throw new Error(j.error||'');
    $('ttl').textContent=j.team&&j.team.name||'Your team';$('sub').textContent=nice(D)+(j.team&&j.team.leader?' · '+j.team.leader:'');
    V=j.villas||[];if(j.done&&Array.isArray(j.done.notDone))j.done.notDone.forEach(id=>no.add(String(id)));
    if(!V.length){$('main').innerHTML='<div class="msg">No villas for this team on this day.</div>';return}
    draw();if(j.done&&j.done.finish)$('fin').value=j.done.finish;$('bar').hidden=false}
  catch(e){$('sub').textContent='Could not open the list';$('main').innerHTML=`<div class="msg">Could not load the villas. Check the internet and open the link again.<p class="help">${esc(e.message)}</p></div>`}
})();
</script>
</body>
</html>
