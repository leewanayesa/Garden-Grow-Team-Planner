<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3a20">
<title>Garden Grow Team Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone = one column + bottom tab bar + sheets; laptop (900px+) = top nav + calendar | teams | issues columns */
:root{
  --bg:#f3f6f1; --surface:#ffffff; --soft:#eef3ec; --ink:#1d2a20; --muted:#5d6b60; --faint:#9aa79d; --line:#d9e2d6;
  --green:#2e7d32; --green-soft:#e6f2e5; --forest:#0f3a20; --orange:#c2410c; --orange-bar:#d9590c; --orange-soft:#fdeee2;
  --red:#b3261e; --red-soft:#fbe9e7; --warn:#a15c07; --warn-soft:#fdf3dc; --shadow:0 1px 3px rgba(15,58,32,.08);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111713; --surface:#1a221c; --soft:#232d25; --ink:#e7efe6; --muted:#a2b4a6; --faint:#6f7f73; --line:#2d3a30;
  --green:#6cc070; --green-soft:#1f3322; --forest:#0b2615; --orange:#f39554; --orange-bar:#e8762f; --orange-soft:#3a2617;
  --red:#ef8a80; --red-soft:#3a1d1a; --warn:#e9b44c; --warn-soft:#3a2f14; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111713; --surface:#1a221c; --soft:#232d25; --ink:#e7efe6; --muted:#a2b4a6; --faint:#6f7f73; --line:#2d3a30;
  --green:#6cc070; --green-soft:#1f3322; --forest:#0b2615; --orange:#f39554; --orange-bar:#e8762f; --orange-soft:#3a2617;
  --red:#ef8a80; --red-soft:#3a1d1a; --warn:#e9b44c; --warn-soft:#3a2f14; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font-family:var(--body);color:inherit;font-size:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--orange-bar);outline-offset:2px}
h2{font-family:var(--display);font-weight:800;font-size:1.35rem;margin:0;line-height:1.15;text-wrap:balance}
h3{margin:0;font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)} .small{font-size:.85rem} p{margin:0}
.redtxt{color:var(--red);font-weight:700} .oktxt{color:var(--green);font-weight:700} .warntxt{color:var(--warn);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center} .spread{justify-content:space-between}
.stack{display:grid;gap:14px} .narrow{max-width:820px}
.card{background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:grid;gap:12px;min-width:0}
.card.dashed{border:1.5px dashed var(--line);box-shadow:none}
.card.tip{background:var(--orange-soft);box-shadow:none;font-size:.92rem}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.field{display:grid;gap:5px;min-width:0} .field.inline{max-width:260px} .field.grow{flex:1 1 300px}
.textin{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.textin.num{max-width:120px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:.92rem;min-height:44px;padding:8px 14px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--surface)}
:root[data-theme="dark"] .btn.primary{color:#0b1a0e}
.btn.big{min-height:54px;font-size:1.05rem;font-weight:700;border-radius:14px;width:100%}
.btn.small{min-height:36px;padding:5px 12px;font-size:.84rem;border-radius:10px}
.btn.warn{color:var(--red)} .btn.arm{background:var(--red-soft);border-color:var(--red)}
.btn.full{width:100%}
.link{border:0;background:none;color:var(--green);font-weight:700;font-size:.9rem;cursor:pointer;padding:6px 0;min-height:36px}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.iconbtn.lg{width:44px;height:44px;border-radius:12px}
.pillbtn{border:1px dashed var(--orange-bar);background:var(--surface);color:var(--orange);border-radius:8px;padding:6px 10px;font-weight:700;font-size:.8rem;cursor:pointer}

/* top bar + tabs */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:14px}
.brandwrap{display:flex;align-items:center;gap:10px;flex:none}
.brandlogo{height:40px;width:auto;display:block;background:#fff;border-radius:6px;padding:2px 4px}
.brand{font-family:var(--display);font-weight:800;font-size:1.05rem;color:var(--green);letter-spacing:.01em;white-space:nowrap}
#topnav{display:none;gap:4px;flex:1}
#topnav button{border:0;background:none;font-weight:600;color:var(--muted);padding:8px 14px;border-radius:10px;cursor:pointer;min-height:40px}
#topnav button.on{background:var(--green);color:var(--surface)}
.syncpill{max-width:46vw;overflow:hidden;text-overflow:ellipsis;margin-left:auto;font-size:.78rem;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:6px 11px;background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap}
.syncpill.ok{color:var(--green);border-color:var(--green)} .syncpill.bad{color:var(--red);border-color:var(--red)}
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
#tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.72rem;font-weight:600;padding:6px 0;cursor:pointer;min-height:56px}
#tabbar button.on{color:var(--green);font-weight:800}
main#view{max-width:1480px;margin:0 auto;padding-inline:16px;padding-block:16px 24px;display:grid;gap:14px}
.pagehead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.datenav.inline{justify-content:flex-start}
.dtxt{text-align:center;min-width:0}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)} .eyebrow.g{color:var(--green)}
.fab{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:25;width:60px;height:60px;border-radius:50%;border:0;background:var(--forest);color:#fff;box-shadow:0 8px 22px rgba(15,58,32,.35);display:flex;align-items:center;justify-content:center;cursor:pointer}
.desk-only{display:none}

/* day layout */
.daygrid{display:grid;gap:14px}
.daygrid .left{display:none}
.center,.right{display:grid;gap:14px;align-content:start;min-width:0}
.dayhead{gap:10px}
.typerow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.typepill{background:var(--green-soft);color:var(--green);font-weight:700;font-size:.88rem;border-radius:999px;padding:6px 14px}
.typepill.nw{background:var(--orange-soft);color:var(--orange)} .typepill.off{background:var(--soft);color:var(--muted)} .typepill.sm{font-size:.72rem;padding:2px 8px}
.status{gap:14px}
.srow{display:flex;align-items:center;gap:12px}
.sicon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.sicon.ok{background:var(--green-soft);color:var(--green)} .sicon.bad{background:var(--red-soft);color:var(--red)} .sicon.warn{background:var(--warn-soft);color:var(--warn)}
.stxt{display:grid;flex:1;min-width:0} .stxt b{font-size:1.02rem} .stxt span{font-size:.88rem;color:var(--muted);overflow-wrap:anywhere}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.kpis.seven{grid-template-columns:repeat(7,minmax(0,1fr))}
.kpis div{background:var(--bg);border-radius:10px;padding:8px 2px;display:grid}
.kpis b{font-family:var(--display);font-weight:800;font-size:1.4rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpis span{font-size:.74rem;color:var(--muted)}
.actions{display:grid;gap:8px}
.act2{display:flex;flex-wrap:wrap;gap:8px} .act2 .btn{flex:1 1 auto}
.sechead{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 0}
.board{display:grid;gap:10px}

/* team cards */
.tcard{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;border-left:6px solid var(--green);min-width:0}
.tcard.proj{border-left-color:var(--orange-bar)}
.tcard.bad{box-shadow:0 0 0 2px var(--red)}
.tcard.drop{outline:3px dashed var(--orange-bar);outline-offset:-3px}
.thead{display:grid;gap:3px;width:100%;text-align:left;border:0;background:none;padding:14px 14px 12px;cursor:pointer;color:var(--ink)}
.tl1{display:flex;align-items:center;gap:8px}
.tname{font-weight:800;font-size:1.02rem;flex:1;min-width:0;overflow-wrap:anywhere}
.tright{font-weight:700;font-size:.88rem;color:var(--green);white-space:nowrap}
.tcard.proj .tright{color:var(--orange)} .tright.warn{color:var(--warn)}
.chev{color:var(--muted);transition:transform .15s}
.tcard.open .chev{transform:rotate(180deg)}
.tl2{font-size:.9rem;overflow-wrap:anywhere} .tl2 b{color:var(--green)} .tcard.proj .tl2 b{color:var(--orange)}
.tl3{font-size:.82rem;color:var(--muted)}
.tprob{display:flex;align-items:center;gap:6px;color:var(--red);font-weight:700;font-size:.82rem;margin-top:4px}
.tbody{display:none;padding:0 14px 14px;gap:10px}
.tcard.open .tbody{display:grid}
.tjob{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.jobsel{flex:1 1 160px;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px;font-weight:600;font-size:.88rem}
.desc{flex:1 1 160px;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px;font-size:.86rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid transparent;background:var(--soft);color:var(--ink);border-radius:999px;padding:8px 13px;font-size:.92rem;cursor:pointer;min-height:38px;display:inline-flex;align-items:center;gap:6px}
.chip.lead{background:var(--green-soft);color:var(--green);font-weight:700;border-color:var(--green)}
.tcard.proj .chip.lead{background:var(--orange-soft);color:var(--orange);border-color:var(--orange-bar)}
.chip .lt{font-size:.68rem;font-weight:700;opacity:.8;text-transform:uppercase;letter-spacing:.05em}
.chip.offc{background:var(--red-soft);color:var(--red)}
.chip.sel{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.varea{display:grid;gap:4px}
.vname{font-size:.78rem;font-weight:700;color:var(--muted)}
.vchips{display:flex;flex-wrap:wrap;gap:5px}
.vchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 9px;font-size:.84rem;cursor:pointer;min-height:32px}
.vchip.moved{border-color:var(--orange-bar)} .vchip.sel{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.vtag{font-size:.68rem;color:var(--muted);margin-left:4px} .vchip.sel .vtag{color:inherit}
.matchrow{display:grid;grid-template-columns:minmax(90px,auto) minmax(0,1fr) auto auto;gap:8px;align-items:center;background:var(--surface);border-radius:12px;padding:8px 10px}
@media (max-width:560px){.matchrow{grid-template-columns:1fr 1fr}.matchrow select{grid-column:1/-1}}
.nickin{width:130px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:6px 8px}
.fulln{font-size:.72rem;margin-top:2px;white-space:normal;max-width:220px}
.chip .sup{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;background:var(--forest);color:#fff;border-radius:4px;padding:1px 4px}
.chip .lv{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:1px 4px}
.lvrow{border-left-color:var(--warn)}
.skillkey summary{cursor:pointer;list-style:none}
.keygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 16px;font-size:.84rem;color:var(--muted);margin-top:8px}
.keygrid b{color:var(--ink);display:inline-block;min-width:72px}
table.skills th,table.skills td{padding:6px 5px}
table.skills tr.allrow th{background:var(--green-soft);color:var(--green);border-bottom:1px solid var(--line)}
.workgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.wk{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;background:var(--surface);min-height:48px}
.wk.on{border-color:var(--green);background:var(--green-soft)}
.wk input{width:18px;height:18px;accent-color:var(--green);flex:none}
.wkt{display:grid;flex:1;min-width:0} .wkt b{font-size:.86rem} .wkt em{font-style:normal;font-size:.72rem;color:var(--muted)}
.wk .cnt{display:flex;align-items:center;gap:4px} .wk .cnt b{min-width:14px;text-align:center}
.iconbtn.sm{width:26px;height:26px;border-radius:7px;font-weight:800}
.heavybox.on{border-color:var(--red);background:var(--red-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;justify-self:start}
.seg button{border:0;background:var(--surface);padding:9px 16px;font-weight:700;color:var(--muted);cursor:pointer;min-height:42px}
.seg button.on{background:var(--ink);color:var(--surface)}
.plist{display:grid;gap:8px}
.pcard{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.pcard.open{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.phead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:12px 14px;cursor:pointer;color:var(--ink)}
.pname{font-weight:700;font-size:.98rem}
.pskills{grid-column:1/2;display:flex;flex-wrap:wrap;gap:4px}
.pskills i{font-style:normal;font-size:.72rem;font-weight:700;background:var(--green-soft);color:var(--green);border-radius:6px;padding:2px 7px}
.pskills em{font-style:normal;font-size:.8rem;color:var(--warn)}
.phead .chev{grid-row:1/3;grid-column:2}
.pcard.open .chev{transform:rotate(180deg)}
.pbody{display:grid;gap:12px;padding:4px 14px 14px;border-top:1px solid var(--line)}
.tgroup{display:grid;gap:6px;margin-top:6px}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{display:grid;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:.9rem;min-height:48px;align-content:center}
.tchip em{font-style:normal;font-weight:500;font-size:.72rem;color:var(--muted)}
.tchip.on{background:var(--green);border-color:var(--green);color:#fff} .tchip.on em{color:rgba(255,255,255,.85)}
.tchip.pick.cur{background:var(--ink);border-color:var(--ink);color:var(--surface)} .tchip.pick.cur em{color:inherit;opacity:.8}
.tchip.big{min-height:44px;font-weight:600}
.tchip.heavyt.on{background:var(--red);border-color:var(--red)}
.byskill{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.picked{display:flex;flex-wrap:wrap;gap:6px}
.pk{display:inline-flex;align-items:center;gap:4px;background:var(--green-soft);border:1px solid var(--green);border-radius:10px;padding:4px 6px 4px 10px;font-size:.86rem}
.pk .num{min-width:14px;text-align:center}
.wsec{border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:8px}
.wsec.closed{background:var(--bg)}
.wsech{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px} .wsech b{font-size:.95rem} .wsech span{font-size:.78rem;color:var(--muted);flex:1}
.wsech.btnlike{border:0;background:none;padding:2px;text-align:left;cursor:pointer;color:var(--ink);align-items:center;width:100%}
.wsec:not(.closed) .btnlike .chev{transform:rotate(180deg)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.wchip{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;min-height:52px}
.wchip.on{border-color:var(--green);background:var(--green-soft)}
.wchip.none:not(.on){opacity:.6}
.wmain{flex:1;display:flex;align-items:center;gap:8px;border:0;background:none;padding:8px 10px;text-align:left;cursor:pointer;color:var(--ink);min-width:0}
.wtick{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;flex:none;background:var(--surface)}
.wchip.on .wtick{background:var(--green);border-color:var(--green);color:#fff}
.wtxt{display:grid;min-width:0} .wtxt b{font-size:.88rem} .wtxt em{font-style:normal;font-size:.72rem;color:var(--muted)}
.wcnt{display:flex;align-items:center;gap:2px;padding:0 6px;border-left:1px solid var(--green)}
.wcnt button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:800;cursor:pointer;color:var(--ink)}
.wcnt b{min-width:16px;text-align:center}
@media (max-width:560px){.wgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.wchip{flex-direction:column}.wcnt{border-left:0;border-top:1px solid var(--green);justify-content:center;padding:4px}.wmain{padding:8px}}
.worktiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.wtile{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:10px;text-align:left;cursor:pointer;color:var(--ink);min-height:52px}
.wtile b{font-size:.9rem;display:block} .wtile em{font-style:normal;font-size:.7rem;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.05em}
.wtile.on{border-color:var(--orange-bar);background:var(--orange-soft)} .wtile.on .wtick{background:var(--orange-bar);border-color:var(--orange-bar);color:#fff}
.needlist{display:grid;gap:6px}
.needrow{display:flex;align-items:center;gap:8px;border:1px solid var(--green);background:var(--green-soft);border-radius:12px;padding:6px 8px 6px 12px}
.needrow.short{border-color:var(--red);background:var(--red-soft)}
.nl{flex:1;display:grid;min-width:0} .nl b{font-size:.9rem} .nl em{font-style:normal;font-size:.74rem;color:var(--muted)} .needrow.short .nl em{color:var(--red);font-weight:700}
.needrow .wcnt{border-left:0}
.worksline{font-weight:700;font-size:.86rem;color:var(--orange);flex:1}
@media (max-width:560px){.worktiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tchip.exp{background:var(--forest);border-color:var(--forest);color:#fff}
.pskills i.x{background:var(--forest);color:#fff}
.learned{font-size:.84rem;background:var(--bg);border-radius:10px;padding:8px 10px;margin:0}
.needgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.needgrid label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;background:var(--bg);border-radius:10px;padding:8px 10px}
.needgrid .num{width:84px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:1rem;background:var(--surface);color:var(--ink)}
.sumline{margin:2px 0 0}

.ps-day.nw{background:#fdeee2}
.ps-day b{font-family:var(--display);font-size:14pt;display:block}
.ps-sec{font-family:var(--display);font-weight:800;font-size:13pt;margin:16px 0 8px;color:#1d2a20}
.ps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ps-team{border:1.5px solid #2e7d32;border-radius:8px;overflow:hidden;break-inside:avoid;background:#fff}
.ps-team .h{background:#2e7d32;color:#fff;padding:7px 10px;font-weight:800;font-family:var(--display);font-size:11.5pt;display:flex;justify-content:space-between;gap:6px}
.ps-team .h span{font-weight:500;font-family:var(--body);font-size:8.5pt;white-space:nowrap}
.ps-team.nw{border-color:#d9590c}.ps-team.nw .h{background:#d9590c}
.ps-team .b{padding:8px 10px;font-size:10.5pt;color:#1d2a20}
.ps-team .pj{font-size:8.5pt;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#5d6b60}
.ps-team .pd{font-size:9.5pt;font-style:italic;margin-top:2px}
.ps-team .ph{font-size:8pt;font-weight:700;color:#b3261e;margin-top:3px}
.ps-team .ld{font-weight:700;color:#2e7d32;border-bottom:1px solid #d9e2d6;padding:6px 0 5px;margin:6px 0 5px;border-top:1px solid #d9e2d6}
.ps-team.nw .ld{color:#d9590c}
.ps-team ul{margin:0;padding-left:16px}.ps-team li{margin:2px 0}
.ps-off{margin-top:10px;padding:9px 14px;border-radius:8px;background:#fbe9e7;color:#b3261e;font-size:10.5pt}
.ps-foot{margin-top:18px;font-size:8pt;color:#5d6b60;border-top:1px solid #d9e2d6;padding-top:6px;display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between}


/* PDF v2 */
.pp{break-after:page;color:#1d2a20;font-size:10pt}
.pp:last-child{break-after:auto}
.phd{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-bottom:8px;border-bottom:2.5px solid #1f6b2a}
.phd img{height:17mm;width:auto}
.phd div{text-align:right}.phd small{display:block;font-size:7.5pt;font-weight:700;letter-spacing:.14em;color:#1f6b2a}
.phd b{display:block;font-family:var(--display);font-weight:800;font-size:18pt;line-height:1.1}
.phd em{display:inline-block;margin-top:3px;font-style:normal;background:#e6f2e5;color:#1f6b2a;font-weight:700;font-size:8pt;padding:2px 9px;border-radius:99px}
.phd em.nw{background:#fdeee2;color:#c2410c}
.psum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:7px 0}
.psum div{border:1px solid #d9e2d6;border-radius:6px;padding:4px 8px}.psum small{display:block;font-size:6.5pt;font-weight:700;letter-spacing:.1em;color:#4e5c51}.psum b{font-size:13pt;font-weight:800}
.pnote{margin:0 0 8px;font-size:9pt}
.pb{border:1px solid #d9e2d6;border-radius:7px;overflow:hidden;margin-bottom:7px;break-inside:avoid}
.pbh{background:#1f6b2a;color:#fff;padding:5px 10px;display:flex;justify-content:space-between;align-items:center}
.pbh b{font-family:var(--display);font-weight:800;font-size:12pt}
.pbh span{background:#fff;color:#1f6b2a;border-radius:5px;padding:1px 8px;font-weight:800;font-size:9pt}
.pbh span.over{color:#a15c07}
.pb.nw .pbh{background:#c2410c}.pb.nw .pbh span{color:#c2410c}.pb.nw .pbp b{color:#c2410c}
.pbp{padding:4px 10px 3px;font-size:9pt;line-height:1.4}.pbp b{color:#1f6b2a}.pbp span{color:#4e5c51}.pbp .hv{color:#b3261e}
.pt{width:100%;border-collapse:collapse;font-size:9pt}
.pt th{background:#f3f6f1;font-size:6.8pt;letter-spacing:.08em;text-transform:uppercase;color:#4e5c51;text-align:left;padding:3px 8px}
.pt td{border-top:1px solid #e7ece5;padding:2.1px 8px}
.pt .n{width:18px;color:#4e5c51;font-weight:700}.pt .v{font-weight:600}.pt .a{color:#4e5c51}
.pt .d{width:32px;text-align:center}.pt td.d i{display:inline-block;width:9.5px;height:9.5px;border:1.2px solid #6b776d;border-radius:2px}
.pt .tag{font-size:7pt;color:#8a5a00;background:#fdf3dc;padding:0 4px;border-radius:3px;font-weight:600}.pt .tag.new{color:#c2410c;background:#fdeee2}
.pnone{margin:0;padding:3px 10px 6px;font-size:9pt;color:#4e5c51}
.pbot{display:grid;grid-template-columns:1fr 1fr;gap:8px;break-inside:avoid}
.pbot>div{border:1px solid #d9e2d6;border-radius:7px;padding:6px 9px;font-size:9pt;line-height:1.45}
.pbot small{display:block;font-size:6.8pt;font-weight:700;letter-spacing:.1em;color:#4e5c51}.pbot span{color:#4e5c51}
.pbot i{display:block;border-bottom:1px solid #d9e2d6;height:13px}
.psign{display:flex;justify-content:space-between;font-size:8.5pt;color:#4e5c51;margin:10px 0 4px}
.pft{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #d9e2d6;padding-top:5px;font-size:6.8pt;color:#4e5c51}
.lp{width:110mm;min-height:240mm;box-sizing:border-box;display:flex;flex-direction:column;break-after:page;color:#1d2a20}
.lp:last-child{break-after:auto}
.lp header{background:#1f6b2a;color:#fff;padding:5mm 6mm}
.lp.nw header{background:#c2410c}
.lp .lt{display:flex;justify-content:space-between;align-items:center;margin-bottom:3mm}
.lp .llogo{flex:none;width:30mm;background:#fff;border-radius:2mm;padding:1mm 2mm;display:block;box-sizing:border-box}.lp .llogo img{width:100%;max-width:none;height:auto;display:block}
.lp header small{font-size:7.5pt;font-weight:700;letter-spacing:.12em}
.lp .ld{font-size:9.5pt;opacity:.9}.lp header b{display:block;font-family:var(--display);font-weight:800;font-size:22pt;line-height:1.1}.lp .ls{font-size:10pt}
.lp section{padding:3.5mm 6mm 0}
.lp section>small{display:block;font-size:7.5pt;font-weight:700;letter-spacing:.1em;color:#4e5c51;margin:2mm 0 1mm}
.lp .lld{font-size:13pt;font-weight:700;color:#1f6b2a}.lp.nw .lld{color:#c2410c}
.lp .lcr{font-size:11pt;line-height:1.5}.lp .hv{color:#b3261e}
.lp .lr{display:flex;gap:3mm;margin-bottom:2.5mm;break-inside:avoid}
.lp .ln{flex:none;width:7mm;height:7mm;border-radius:50%;background:#1f6b2a;color:#fff;font-weight:800;font-size:10pt;display:flex;align-items:center;justify-content:center}
.lp .lr>div{flex:1}.lp .lr b{font-size:11.5pt;display:block;padding-top:.8mm}
.lp .lv{display:flex;justify-content:space-between;align-items:center;font-size:11pt;padding:1.4mm 0;border-bottom:1px solid #eef3ec}
.lp .lv em{font-style:normal;font-size:8pt;color:#8a5a00;background:#fdf3dc;padding:0 1.5mm;border-radius:1mm}
.lp .lv i{width:4.2mm;height:4.2mm;border:1.5px solid #6b776d;border-radius:1mm;flex:none}
.lp .lnt div{background:#f3f6f1;border-radius:2mm;padding:2.5mm 3mm;font-size:10.5pt;color:#4e5c51}
.lp footer{margin-top:auto;border-top:1px solid #d9e2d6;padding:3mm 6mm;display:flex;justify-content:space-between;font-size:7.5pt;color:#4e5c51}
/* print table */
.ps-table{width:100%;border-collapse:collapse;font-size:10pt;margin-top:10px;color:#1d2a20}
.ps-table th{text-align:left;font-size:8.5pt;text-transform:uppercase;letter-spacing:.05em;color:#5d6b60;border-bottom:1.5px solid #0f3a20;padding:5px 6px}
.ps-table td{border-bottom:1px solid #d9e2d6;padding:5px 6px}
.ps-table td.n,.ps-table th.n{text-align:right;font-variant-numeric:tabular-nums}
.ps-note{font-size:9pt;color:#5d6b60;margin-top:6px}
/* villas */
.villas{border-top:1px solid var(--line);padding:8px 12px 10px;display:grid;gap:4px;font-size:.84rem}
.villas .vh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.villas .vh b{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.villas .vh span{font-weight:700;font-variant-numeric:tabular-nums}
.villas .vh span.over{color:var(--red)}
.varea{display:flex;flex-wrap:wrap;gap:4px;align-items:baseline}
.varea i{font-style:normal;font-weight:700;color:var(--muted);font-size:.76rem;margin-right:2px}
.vchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:2px 7px;font-size:.8rem;cursor:pointer}
.vchip.moved{border-color:var(--orange)}
.vchip.sel{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.vtag{font-size:.66rem;color:var(--muted);margin-left:3px}
.overwarn{padding:6px 12px;background:var(--orange-soft);color:var(--orange);font-size:.8rem;font-weight:700}
.loadtbl{width:100%;border-collapse:collapse;font-size:.84rem}
.loadtbl td{padding:4px 6px;border-bottom:1px solid var(--line)}
.loadtbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.loadtbl .heavy-row td{color:var(--red);font-weight:700}
.lightdays{display:flex;flex-wrap:wrap;gap:6px}
.ps-team .pv{border-top:1px solid #d9e2d6;margin-top:6px;padding-top:5px;font-size:9pt}
.ps-team .pv b{font-size:8pt;text-transform:uppercase;letter-spacing:.05em;color:#5d6b60}
.ps-team .pv div{margin-top:2px}
.ps-team .pv{border-top:1px solid #d9e2d6;margin-top:6px;padding-top:5px;font-size:9pt}
.ps-team .pv b{font-size:8pt;text-transform:uppercase;letter-spacing:.05em;color:#5d6b60}
.ps-team .pv div{margin-top:2px}

</style>
</head>

function clientsOn(date){

/* Split villas (in drive order) across k teams AREA BY AREA: an area stays with one team even if that team gets
   more villas; an area is only divided when it alone has more villas than one team can cover (the max per team). */
function splitVillas(list,k){
  if(k<=0)return [];
  const n=list.length; if(!n)return Array.from({length:k},()=>[]);
  const cap=maxV(), groups=[];
  for(let i=0;i<n;){let j=i;while(j<n&&areaShort(list[j])===areaShort(list[i]))j++;const g=list.slice(i,j);
    if(g.length>cap){const parts=Math.ceil(g.length/cap),size=Math.ceil(g.length/parts);for(let p=0;p<g.length;p+=size)groups.push(g.slice(p,p+size))}else groups.push(g);
    i=j}
  const m=groups.length, pre=[0];groups.forEach(g=>pre.push(pre[pre.length-1]+g.length));
  const dp=Array.from({length:m+1},()=>Array(k+1).fill(Infinity)), cut=Array.from({length:m+1},()=>Array(k+1).fill(0));
  dp[0][0]=0;
  for(let j=1;j<=k;j++)for(let i=0;i<=m;i++)for(let p=0;p<=i;p++){
    if(dp[p][j-1]===Infinity)continue;
    const v=Math.max(dp[p][j-1],pre[i]-pre[p]);
    if(v<dp[i][j]){dp[i][j]=v;cut[i][j]=p}
  }
  const res=[];let i=m;
  for(let j=k;j>=1;j--){const p=cut[i][j];res.unshift(groups.slice(p,i).flat());i=p}
  return res;
}
/* Which villas each maintenance team covers on a date. Manual moves and skips for that day are kept. */
function villaPlan(date,teams){
  const r=dayRec(date), moved=r.villaMove||{}, skip=new Set(r.villaSkip||[]);
  const maint=teams.filter(t=>!isProj(t)), ids=new Set(maint.map(t=>t.id));
  const all=clientsOn(date).filter(c=>!skip.has(c.id));
  const auto=all.filter(c=>!(moved[c.id]&&ids.has(moved[c.id])));
  let parts=splitVillas(auto,maint.length); const byTeam={};
  if(maint.length>1&&maint.length<=6&&S.learn&&S.learn.a){
    const fit=(part,t)=>part.reduce((s,c)=>s+learnA(areaShort(c),t),0);
    const perm=a=>a.length<=1?[a]:a.flatMap((x,i)=>perm([...a.slice(0,i),...a.slice(i+1)]).map(r=>[x,...r]));
    let best=null,bs=0.0001*maint.length;
    perm(parts.map((_,i)=>i)).forEach(o=>{const s=o.reduce((acc,pi,ti)=>acc+fit(parts[pi]||[],maint[ti])+(pi===ti?0.001:0),0);if(s>bs+0.0001){bs=s;best=o}});
    if(best)parts=best.map(i=>parts[i]);
  }
  maint.forEach((t,i)=>byTeam[t.id]=[...(parts[i]||[])]);
  all.forEach(c=>{const to=moved[c.id];if(to&&ids.has(to))byTeam[to].push(c)});
  maint.forEach(t=>byTeam[t.id].sort((a,b)=>zoneOf(a)-zoneOf(b)||areaShort(a).localeCompare(areaShort(b))||villaName(a).localeCompare(villaName(b))));
  return {byTeam,skipped:clientsOn(date).filter(c=>skip.has(c.id)),total:all.length};
}
const maxV=()=>S.settings.maxVillas||7;
function villaGroups(list){const g=[];list.forEach(c=>{const a=areaShort(c),last=g[g.length-1];if(last&&last.area===a)last.items.push(c);else g.push({area:a,items:[c]})});return g}
function overloaded(date){const teams=effTeams(date),vp=villaPlan(date,teams);return teams.filter(t=>!isProj(t)&&(vp.byTeam[t.id]||[]).length>maxV())}
/* Villas per maintenance team on a date if new work runs (or not) that day. */
function loadFor(date,withJob){
  const v=clientsOn(date).filter(c=>!(dayRec(date).villaSkip||[]).includes(c.id)).length;
  const teams=(withJob||activeProjects(date).length?S.layouts.newwork:S.layouts.normal).filter(t=>jobOf(t).group==='maint').length||1;
  return {villas:v,teams,per:Math.ceil(v/teams)};
}

  const fixT=ts=>ts&&ts.forEach(t=>{if(t.leader===oldN)t.leader=newN;t.members=fix(t.members).filter(m=>m!==t.leader)});
  o.staff=fix(o.staff);
  if(o.skills&&o.skills[oldN]){o.skills[newN]=[...new Set([...(o.skills[newN]||[]),...o.skills[oldN]])];delete o.skills[oldN]}
  if(o.nicks&&o.nicks[oldN]!=null){if(!o.nicks[newN])o.nicks[newN]=o.nicks[oldN];delete o.nicks[oldN]}
  if(o.supervisors)o.supervisors=fix(o.supervisors);
  (o.leaves||[]).forEach(l=>{if(l.name===oldN)l.name=newN});
  if(o.expert&&o.expert[oldN]){o.expert[newN]=[...new Set([...(o.expert[newN]||[]),...o.expert[oldN]])];delete o.expert[oldN]}
  if(o.learn){['w','t','l','a'].forEach(k=>Object.values(o.learn[k]||{}).forEach(m=>{if(m[oldN]!=null){m[newN]=(m[newN]||0)+m[oldN];delete m[oldN]}}));const np={};Object.entries(o.learn.p||{}).forEach(([k,v])=>{const ab=k.split('|').map(x=>x===oldN?newN:x);np[pairKey(ab[0],ab[1])]=v});o.learn.p=np}
  (o.projects||[]).forEach(pr=>{if(pr.pins)pr.pins=fix(pr.pins)});
  Object.values(o.days||{}).forEach(d=>{if(d.leaveOff)d.leaveOff=fix(d.leaveOff)});
  fixT(o.layouts.normal);fixT(o.layouts.newwork);
  (o.projects||[]).forEach(p=>{if(p.crew.leader===oldN)p.crew.leader=newN;p.crew.members=fix(p.crew.members)});
  Object.values(o.days||{}).forEach(d=>{fixT(d.teams);if(d.absent)d.absent=fix(d.absent)});
}
function applyEmployeeList(o){
  o.nicks=o.nicks||{};
  Object.entries(EMP_MATCH).forEach(([old,full])=>{if(o.staff.includes(old)&&!o.staff.includes(full)){renameIn(o,old,full);o.nicks[full]=old}});
  EMPLOYEES.forEach(full=>{if(!o.staff.includes(full)){o.staff.push(full);if(EMP_NICK[full])o.nicks[full]=EMP_NICK[full]}});
  o.toMatch=o.staff.filter(n=>!EMPLOYEES.includes(n));
}

/* ---------- migration from earlier versions ---------- */
function migrate(o){
  if(!o.skills)o.skills=clone(DEFAULT.skills);
  if(!o.jobs||!o.jobs.length)o.jobs=clone(DEFAULT_JOBS);
  if(!o.days)o.days={};
  if(!o.projects)o.projects=[];
  if(!o.settings)o.settings={dayOff:-1};
  if(o.settings.dayOff==null)o.settings.dayOff=-1;
  if(!o.settings.maxVillas)o.settings.maxVillas=7;
  if(!o.nicks)o.nicks={};
  if(!o.supervisors)o.supervisors=[];
  if(!o.namesV6){applyEmployeeList(o);o.namesV6=true}
  if(!o.namesV7){
    if(o.staff.includes('Palus')&&!o.staff.includes('Pawulos Getachew Tadesse')){renameIn(o,'Palus','Pawulos Getachew Tadesse');o.nicks['Pawulos Getachew Tadesse']='Palus'}
    ['Pawulos Getachew Tadesse','Endashaw Adefris Gared'].forEach(f=>{if(!o.staff.includes(f)){o.staff.push(f);o.nicks[f]=EMP_NICK[f]}});
    o.toMatch=(o.toMatch||[]).filter(n=>o.staff.includes(n)&&!EMPLOYEES.includes(n));
    o.namesV7=true;
  }
  if(!o.leaves)o.leaves=[];
  if(!o.skillsV15){
    Object.keys(o.skills||{}).forEach(n=>{const a=o.skills[n]||[];if(a.includes('paving')&&!a.includes('hardscape'))a.push('hardscape');if(a.includes('irrigation')&&!a.includes('irrfix'))a.push('irrfix');o.skills[n]=a.filter(x=>x!=='paving')});
    o.jobs=(o.jobs||[]).filter(j=>j.id!=='paving');
    const hj=o.jobs.find(j=>j.id==='hardscape'); if(hj){hj.name='Concrete & paving';if(hj.need&&hj.need.paving){hj.need.hardscape=Math.max(hj.need.hardscape||0,hj.need.paving)}}
    o.jobs.forEach(j=>{if(j.need)delete j.need.paving});
    (o.projects||[]).forEach(pr=>{if(pr.type==='paving')pr.type='hardscape';if(pr.need&&pr.need.paving){pr.need.hardscape=Math.max(pr.need.hardscape||0,pr.need.paving);delete pr.need.paving}if(!pr.works)pr.works=[WORK_BY_JOB[pr.type]||'planting']});
    o.skillsV15=true;
  }
  if(!o.jobsV16){
    const hj=o.jobs.find(j=>j.id==='hardscape'); if(hj){hj.heavy=false;hj.need={hardscape:1};hj.min=2}
    if(!o.jobs.some(j=>j.id==='treeremoval')){const k=o.jobs.findIndex(j=>j.id==='tree');o.jobs.splice(k<0?o.jobs.length:k+1,0,{id:'treeremoval',name:'Tree removal',group:'project',min:4,heavy:true,need:{tools:1,heavy:2,driver:1}})}
    (o.projects||[]).forEach(pr=>{if((pr.works||[]).length===1&&pr.works[0]==='hard'){pr.heavy=false;if(pr.need){delete pr.need.heavy;if(pr.need.general===1)delete pr.need.general}}});
    o.jobsV16=true;
  }
  if(!o.jobsV17){
    const tj=o.jobs.find(j=>j.id==='turf'); if(tj&&/grass/i.test(tj.name))tj.name='Natural grass laying';
    if(!o.jobs.some(j=>j.id==='artgrass')){const k=o.jobs.findIndex(j=>j.id==='turf');o.jobs.splice(k<0?o.jobs.length:k+1,0,{id:'artgrass',name:'Artificial grass',group:'project',min:2,heavy:false,need:{artgrass:1}})}
    o.jobsV17=true;
  }
  if(!o.expert)o.expert={};
  if(!o.v18){(o.projects||[]).forEach(pr=>{if(pr.crewOk==null)pr.crewOk=pr.from<TODAY});o.v18=true}
  if(!o.jobsV9){
    const hj=o.jobs.find(j=>j.id==='hardscape'); if(hj&&/hardscape/i.test(hj.name)){hj.name='Concrete works (planters, concrete)';hj.heavy=true;hj.need=Object.assign({hardscape:1},hj.need||{});if(!hj.need.general)hj.need.general=1}
    const add={landscape:1,turf:2,cleanup:2}; o.jobs.forEach(j=>{if(add[j.id]&&j.need&&j.need.general==null)j.need.general=add[j.id]});
    o.jobsV9=true;
  }
  if(!o.jobsV10){
    DEFAULT_JOBS.forEach((dj,k)=>{if(!o.jobs.some(j=>j.id===dj.id)){o.jobs.splice(Math.min(k,o.jobs.length),0,clone(dj))}});
    const m=o.jobs.find(j=>j.id==='maint'); if(m){m.need=m.need||{};if(m.need.lawn==null)m.need.lawn=1;if(m.need.hedge==null)m.need.hedge=1}
    const tf=o.jobs.find(j=>j.id==='turf'); if(tf&&tf.need&&tf.need.turf==null){tf.need.turf=1;if(tf.need.planting===1)delete tf.need.planting}
    o.jobsV10=true;
  }
  if(!o.clients){o.clients=clone(SEED_CLIENTS);o.clientsInfo={source:'Starting list from the roster app file',loaded:'2026-10-19'}}
  if(!o.updatedAt)o.updatedAt=0;
  const fixT=ts=>ts&&ts.forEach(t=>{if(!t.job)t.job=t.kind==='newwork'?'landscape':'maint';delete t.kind;if(t.desc==null)t.desc='';if(!t.members)t.members=[]});
  fixT(o.layouts.normal);fixT(o.layouts.newwork);
  const grp=t=>((o.jobs.find(j=>j.id===t.job)||{}).group);
  const dates=Object.keys(o.days).sort();
  let last=null;
  for(const s of dates){
    const r=o.days[s]; if(!r.absent)r.absent=[]; fixT(r.teams);
    const wasNW=r.mode==='newwork';
    if(wasNW||(r.teams&&r.teams.some(t=>t.extra))){
      let teams=r.teams;
      if(!teams){const ab=new Set(r.absent);teams=clone(o.layouts.newwork).map(t=>{if(ab.has(t.leader))t.leader=null;t.members=t.members.filter(m=>!ab.has(m));return t})}
      const pts=teams.filter(t=>!t.projectId&&(t.extra||(wasNW&&grp(t)!=='maint')));
      pts.forEach((t,i)=>{
        const title=(t.desc||r.site||(t.extra?t.name:'New work')).trim();
        let p=o.projects.find(p=>p.title===title&&p.type===t.job&&addDays(p.to,1)===s);
        if(p)p.to=s; else{p={id:'p'+uid(),title,type:t.job,from:s,to:s,done:false,crew:{leader:t.leader||null,members:[...t.members]}};o.projects.push(p)}
        if(r.teams){t.projectId=p.id;t.name=title;delete t.extra}
      });
    }
    delete r.mode; delete r.site;
  }
  return o;
}

/* ---------- expertise + learning ---------- */

function pairKey(a,b){return a<b?a+'|'+b:b+'|'+a}
function LRN(){if(!S.learn)S.learn={w:{},t:{},p:{},l:{},a:{}};['w','t','p','l','a'].forEach(k=>{if(!S.learn[k])S.learn[k]={}});return S.learn}
function bump(map,key,n,d){const m=map[key]||(map[key]={});m[n]=Math.round(Math.max(-10,Math.min(30,(m[n]||0)+d))*10)/10}

const learnT=(id,n)=>((LRN().t[id]||{})[n]||0);

function teamKeys(t){const p=t.projectId&&projById(t.projectId);return p?(p.works||[]).map(w=>'w:'+w):['t:'+t.id]}
function learnInTeam(t,n,d){const p=t.projectId&&projById(t.projectId);if(p)(p.works||[]).forEach(w=>bump(LRN().w,w,n,d));else bump(LRN().t,t.id,n,d)}
function learnLead(t,n,d){teamKeys(t).forEach(k=>bump(LRN().l,k,n,d))}
const learnL=(t,n)=>teamKeys(t).reduce((a,k)=>a+((LRN().l[k]||{})[n]||0),0);

/* Areas: who usually covers which area (kept per leader, so it follows the leader between layouts). */
const areaKey=t=>t.leader||('team:'+t.id);
const learnA=(area,t)=>((LRN().a[area]||{})[areaKey(t)]||0);
function learnAreaMove(date,villaId,toId){

  const teams=effTeams(date), vp=villaPlan(date,teams), from=teams.find(t=>(vp.byTeam[t.id]||[]).some(x=>x.id===villaId)), to=teams.find(t=>t.id===toId), a=areaShort(c);
  if(from&&from!==to)bump(LRN().a,a,areaKey(from),-1);

/* Past days you edited teach the planner who usually works where. Each day is read once. */
function learnHistory(){Object.entries(S.days).forEach(([s,r])=>{if(s>=TODAY||!r.teams||r.learned)return;r.teams.forEach(t=>{people(t).forEach(n=>learnInTeam(t,n,0.5));if(t.leader)learnLead(t,t.leader,0.5);learnPairs(t,0.2)});try{const vp=villaPlan(s,r.teams);r.teams.filter(t=>!isProj(t)).forEach(t=>{const moved=r.villaMove||{};new Set((vp.byTeam[t.id]||[]).map(areaShort)).forEach(a=>bump(LRN().a,a,areaKey(t),0.3));(vp.byTeam[t.id]||[]).filter(c=>moved[c.id]===t.id).forEach(c=>bump(LRN().a,areaShort(c),areaKey(t),0.5))})}catch(e){}r.learned=true})}
function affinity(t,n){const p=t.projectId&&projById(t.projectId);return p?(p.works||[]).reduce((a,w)=>a+learnW(w,n),0)/Math.max(1,(p.works||[]).length):learnT(t.id,n)}
/* When you move someone by hand, remember it. */

  if(to){learnInTeam(to,name,isProj(to)?2:1);people(to).forEach(m=>{const k=pairKey(name,m);LRN().p[k]=Math.round(Math.min(30,(LRN().p[k]||0)+0.3)*10)/10})}
}
function learnedText(n){
  const L=LRN(), out=[];
  const works=WORKS.map(w=>[w.name,learnW(w.id,n)]).filter(x=>x[1]>=1).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
  if(works.length)out.push('often on '+works.join(', '));
  const maint=[...S.layouts.normal,...S.layouts.newwork].filter(t=>jobOf(t).group==='maint').map(t=>[t.name,learnT(t.id,n)]).filter(x=>x[1]>=1).sort((a,b)=>b[1]-a[1]);
  if(maint.length)out.push('usually in '+maint[0][0]);
  const leads=Object.entries(L.l).filter(([k,m])=>(m[n]||0)>=2).length; if(leads)out.push('often leads');
  const ar=Object.entries(L.a||{}).map(([a,m])=>[a,m[n]||0]).filter(x=>x[1]>=1.5).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0]); if(ar.length)out.push('usually covers '+ar.join(', '));
  const avoid=WORKS.filter(w=>learnW(w.id,n)<=-1).map(w=>w.name); if(avoid.length)out.push('moved off '+avoid.join(', ')+' before');

/* ---------- building a day's teams ---------- */
function projectTeam(p,ab,taken){
  const ok=n=>n&&!ab.has(n)&&!taken.has(n);
  const t={id:'p-'+p.id,projectId:p.id,name:p.title,job:p.type,desc:'',leader:ok(p.crew.leader)?p.crew.leader:null,members:p.crew.members.filter(ok)};
  people(t).forEach(n=>taken.add(n));
  return t;
}
function defaultTeams(s){
  const r=dayRec(s), ab=new Set(r.absent||[]), ps=activeProjects(s);
  let teams;
  if(!ps.length)teams=clone(S.layouts.normal);
  else{
    const taken=new Set();
    const pts=ps.map(p=>projectTeam(p,ab,taken));
    const base=clone(S.layouts.newwork.filter(t=>jobOf(t).group==='maint'));
    base.forEach(t=>{if(taken.has(t.leader))t.leader=null;t.members=t.members.filter(m=>!taken.has(m))});
    teams=[...pts,...base];
  }
  teams.forEach(t=>{if(ab.has(t.leader))t.leader=null;t.members=t.members.filter(m=>!ab.has(m))});
  return teams;
}
function effTeams(s){const r=dayRec(s);return r.teams||defaultTeams(s)}
/* Keep an edited day in step with the jobs running on it. Other edits on that day are kept. */
function reconcile(s){
  const r=S.days[s]; if(!r||!r.teams)return;
  const ab=new Set(r.absent||[]), ps=activeProjects(s), ids=new Set(ps.map(p=>p.id));
  /* New work started or ended on this day: maintenance teams follow the right standard setup
     (3 teams on a normal day, the new-work setup when a job runs), and the teams are built again. */
  if(s>=TODAY){
    const want=(ps.length?S.layouts.newwork:S.layouts.normal).filter(t=>jobOf(t).group==='maint').map(t=>t.id).sort().join(','),
          have=r.teams.filter(t=>!t.projectId).map(t=>t.id).sort().join(',');
    if(want!==have){if(ps.length)buildDay(s);else r.teams=null;return}
  }
  r.teams=r.teams.filter(t=>!t.projectId||ids.has(t.projectId));
  const taken=new Set();
  r.teams.filter(t=>t.projectId).forEach(t=>people(t).forEach(n=>taken.add(n)));
  ps.forEach(p=>{
    let t=r.teams.find(t=>t.projectId===p.id);
    if(!t){
      const crew=[p.crew.leader,...p.crew.members].filter(n=>n&&!ab.has(n)&&!taken.has(n));
      r.teams.forEach(x=>{if(!x.projectId){if(crew.includes(x.leader))x.leader=null;x.members=x.members.filter(m=>!crew.includes(m))}});
      t=projectTeam(p,ab,taken); r.teams.unshift(t);
    }
    t.name=p.title; t.job=p.type;
  });
  if(!ps.length&&!r.teams.some(t=>!t.projectId))r.teams=null;
}
function reconcileAll(){Object.keys(S.days).forEach(reconcile)}
function ctxTeams(ctx,forEdit){

/* ---------- checks and suggestions ---------- */
function problems(t){
  const j=jobOf(t), ppl=people(t), out=[];
  if(!t.leader)out.push({kind:'lead',text:'No leader'});
  for(const [sk,n] of Object.entries(jobNeeds(j))){
    if(!n||!active(sk))continue;
    const c=ppl.filter(p=>has(p,sk)).length;
    if(c<n)out.push({kind:'skill',skill:sk,short:n-c,text:`Missing ${SK[sk]}${n-c>1?' ×'+(n-c):''}`});
  }
  if(ppl.length<j.min){const s=j.min-ppl.length;out.push({kind:'size',short:s,text:`Short by ${s} ${s===1?'person':'people'}`})}
  return out;
}
const weight=t=>problems(t).reduce((a,p)=>a+(p.kind==='lead'?10:p.kind==='skill'?3*p.short:p.short),0);
/* Smart builder. Works on a copy of the day and returns the moves with the reason for each:
   1. people who must be on a job, 2. urgent and bigger jobs first, 3. leader, 4. the scarcest skills first,
   5. team size (labour first), 6. everyone left goes to the maintenance team they usually work in.
   Each candidate is scored on: the skills they cover (experts score higher), what they usually do (learned),
   who they work well with, and not taking a scarce skill another job still needs. Maintenance teams only give
   people they can spare without breaking their own needs. */
function suggest(date){
  learnHistory();
  const sim=clone(effTeams(date)), absent=new Set(dayRec(date).absent||[]);
  const projOf=t=>t.projectId&&projById(t.projectId);
  const placed=new Set(); sim.forEach(t=>people(t).forEach(p=>placed.add(p)));
  let avail=S.staff.filter(n=>!absent.has(n)&&!placed.has(n));
  const defTeam=S.layouts.newwork.find(t=>jobOf(t).group!=='maint'), defCrew=new Set(defTeam?people(defTeam):[]);
  const moves=[];
  const pinsOf=t=>{const p=projOf(t);return p?(p.pins||[]).filter(n=>S.staff.includes(n)&&!absent.has(n)):[]};
  const short=t=>{const m={};problems(t).forEach(p=>{if(p.kind==='skill')m[p.skill]=p.short});return m};
  const demandElsewhere=t=>{const m={};sim.forEach(x=>{if(x===t)return;Object.entries(short(x)).forEach(([k,v])=>m[k]=(m[k]||0)+v)});return m};
  const canGive=(d,n)=>{if(d.leader===n||pinsOf(d).includes(n))return false;const before=weight(d);return weight({...d,members:d.members.filter(m=>m!==n)})<=before};
  function score(n,t,src,mode,skill){
    let s=0; const why=[], need=jobNeeds(jobOf(t)), sh=short(t);
    if(skill){if(expert(n,skill)){s+=3;why.push('expert')}else s+=1}
    const covers=Object.keys(sh).filter(k=>k!==skill&&has(n,k)); if(covers.length){s+=2*covers.length;why.push('also '+covers.map(k=>SK[k]).join(', '))}
    const aff=affinity(t,n);
    if(aff){s+=Math.max(-4,Math.min(4,aff*0.5));if(aff>=2)why.push(isProj(t)?'often on this kind of work':'usually in this team');if(aff<=-1)why.push('was moved off this work before')}
    if(mode==='lead'){const l=learnL(t,n);if(l){s+=Math.min(4,l*0.7);if(l>=2)why.push('often leads this work')}if(isSup(n))s+=1}
    else if(has(n,'lead'))s-=0.7;
    const pr=people(t).reduce((a,m)=>a+learnP(n,m),0); if(pr>0){s+=Math.min(2,pr*0.2);if(pr>=2)why.push('works well with this team')}
    const dem=demandElsewhere(t), scarce=Object.keys(dem).filter(k=>has(n,k)&&!need[k]); if(scarce.length)s-=1.2*scarce.length;
    const p=projOf(t); if(p&&!p.crewOk&&defCrew.has(n))s+=0.8;
    if(!src)s+=1; else if(!isProj(src)&&learnT(src.id,n)>=3)s-=1;
    return {s,why};
  }
  function pick(t,pred,mode,skill){
    const cs=[];
    avail.forEach(n=>{if(pred(n))cs.push({name:n,from:null})});
    sim.forEach(d=>{if(d===t)return;d.members.forEach(m=>{if(pred(m)&&canGive(d,m))cs.push({name:m,from:d})})});
    if(!cs.length)return null;
    cs.forEach(c=>Object.assign(c,score(c.name,t,c.from,mode,skill)));
    cs.sort((a,b)=>b.s-a.s||a.name.localeCompare(b.name));
    return cs[0];
  }
  const doMove=(c,t,base,lead)=>{
    if(c.from){if(c.from.leader===c.name)c.from.leader=null;c.from.members=c.from.members.filter(m=>m!==c.name)}else avail=avail.filter(n=>n!==c.name);
    if(lead)t.leader=c.name; else t.members.push(c.name);
    moves.push({type:'move',name:c.name,fromName:c.from?c.from.name:'Available',to:t.id,toName:t.name,why:[base,...(c.why||[])].filter(Boolean).join(' · '),makeLead:!!lead});
  };
  const pri=t=>{const p=projOf(t);return (p&&p.urgent?1000:0)+(isProj(t)?100:0)+Object.values(jobNeeds(jobOf(t))).reduce((a,b)=>a+b,0)};
  const order=[...sim].sort((a,b)=>pri(b)-pri(a));
  order.forEach(t=>pinsOf(t).forEach(n=>{if(people(t).includes(n))return;const from=sim.find(x=>people(x).includes(n));doMove({name:n,from:from||null,why:[]},t,'Must be on this job')}));
  const holders=sk=>S.staff.filter(n=>!absent.has(n)&&has(n,sk)).length;
  for(let guard=0;guard<150;guard++){
    let done=false;
    for(const t of order){
      const ps=problems(t);
      if(ps.some(p=>p.kind==='lead')){
        const inTeam=t.members.filter(x=>has(x,'lead')).map(x=>({name:x,...score(x,t,null,'lead')})).sort((a,b)=>b.s-a.s)[0];
        if(inTeam){t.members=t.members.filter(x=>x!==inTeam.name);t.leader=inTeam.name;moves.push({type:'lead',name:inTeam.name,to:t.id,toName:t.name,why:['Team has no leader',...inTeam.why].join(' · ')});done=true;break}
        if(active('lead')){const c=pick(t,n=>has(n,'lead'),'lead');if(c){doMove(c,t,'Team has no leader',true);done=true;break}}
      }
      let did=false;
      for(const p of ps.filter(p=>p.kind==='skill').sort((a,b)=>holders(a.skill)-holders(b.skill))){
        const c=pick(t,n=>has(n,p.skill),'skill',p.skill); if(c){doMove(c,t,`Needs ${SK[p.skill]}`);did=true;break}
      }
      if(did){done=true;break}
      if(ps.some(p=>p.kind==='size')){
        const c=(active('general')&&pick(t,n=>has(n,'general'),'size','general'))||pick(t,()=>true,'size');
        if(c){doMove(c,t,'Team is short of people');done=true;break}
      }
    }
    if(!done)break;
  }
  for(const n of [...avail]){
    const pool=sim.filter(t=>!isProj(t)); if(!pool.length)break;
    const best=[...pool].sort((a,b)=>(learnT(b.id,n)-learnT(a.id,n))||(people(a).length-people(b).length))[0];
    doMove({name:n,from:null,why:[]},best,learnT(best.id,n)>=2?'Usually in this team':'Added to the smallest maintenance team');
  }
  const left=[];sim.forEach(t=>problems(t).forEach(p=>left.push(`${t.name}: ${p.text}`)));
  return {moves,left};
}
function applyMove(date,m){
  const ctx={type:'day',date};
  if(m.type==='lead')makeLeader(ctx,m.name);
  else{moveTo(ctx,m.name,m.to);if(m.makeLead)makeLeader(ctx,m.name)}
}
/* Build = start from the standard teams + jobs, then fix every gap the rules allow. */
function buildDay(date){
  const r=ensureDay(date); r.teams=defaultTeams(date);
  const fresh=activeProjects(date).filter(p=>!p.crewOk);
  fresh.forEach(p=>{const t=r.teams.find(t=>t.projectId===p.id);if(t){t.leader=null;t.members=[]}});
  const {moves}=suggest(date); moves.forEach(m=>applyMove(date,m));
  fresh.forEach(p=>{const t=r.teams.find(t=>t.projectId===p.id);if(t&&people(t).length){saveCrew(p,t,date);p.crewOk=true}});
  save();
  return {moves,left:suggest(date).left};
}
/* Save a job's crew so every day of the job uses it. Days already edited get the new crew too. */
function saveCrew(p,t,fromDate){
  p.crew={leader:t.leader||null,members:[...t.members]};
  Object.keys(S.days).forEach(s=>{
    if(s===fromDate||s<p.from||s>p.to)return;
    const r=S.days[s]; if(!r.teams)return;
    const pt=r.teams.find(x=>x.projectId===p.id); if(!pt)return;
    const ab=new Set(r.absent||[]), crew=people(p.crew).filter(n=>!ab.has(n));
    r.teams.forEach(x=>{if(x!==pt){if(crew.includes(x.leader))x.leader=null;x.members=x.members.filter(m=>!crew.includes(m))}});
    pt.leader=p.crew.leader&&!ab.has(p.crew.leader)?p.crew.leader:null; pt.members=p.crew.members.filter(n=>!ab.has(n));
  });
}
const crewMatches=(p,t,date)=>{const ab=new Set(dayRec(date).absent||[]);const ld=p.crew.leader&&!ab.has(p.crew.leader)?p.crew.leader:null;
  return ld===(t.leader||null)&&JSON.stringify(p.crew.members.filter(n=>!ab.has(n)).sort())===JSON.stringify([...t.members].sort())};

function removeStaff(n){
  S.staff=S.staff.filter(x=>x!==n); delete S.skills[n]; if(S.expert)delete S.expert[n]; S.projects.forEach(pr=>{if(pr.pins)pr.pins=pr.pins.filter(x=>x!==n)}); if(S.nicks)delete S.nicks[n]; S.supervisors=(S.supervisors||[]).filter(x=>x!==n); if(S.toMatch)S.toMatch=S.toMatch.filter(x=>x!==n); S.leaves=(S.leaves||[]).filter(l=>l.name!==n);
  const fixT=ts=>ts&&ts.forEach(t=>{if(t.leader===n)t.leader=null;t.members=t.members.filter(x=>x!==n)});

async function push(){
  const url=syncUrl(); if(!url)return;

  if(pushing){schedulePush();return}
  if(!navigator.onLine){setSync('offline');return}
  pushing=true; setSync('saving');

    const st=clone(S); delete st.syncedAt; delete st.isSeed;
    const res=await fetchT(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'save',baseUpdatedAt:S.syncedAt||0,state:st,readable:readableRows()})});

    else if(j.conflict&&j.state){adoptRemote(j.state);toast('Another phone saved newer changes. The plan has been updated; please redo your last change.')}

async function pull(){
  const url=syncUrl(); if(!url||pulling||pushing)return;
  pulling=true; if(syncStatus!=='pending')setSync('loading');

    const res=await fetchT(url+(url.includes('?')?'&':'?')+'action=load&t='+Date.now(),{},25000);
    const j=await readJson(res);

    if(remote&&S.isSeed){adoptRemote(remote);toast('Your plan was loaded from the Google Sheet')}
    else if(!remote&&S.isSeed){delete S.isSeed}
    else if(newer&&rR<0.6*rL&&rL-rR>=5){
      if(confirm(`The Google Sheet has much LESS data than this device (skills, leave, jobs).\n\nOK = keep THIS device's data and send it to the Sheet (recommended)\nCancel = replace this device with the Sheet's data`)){S.updatedAt=Math.max(Date.now(),(remote.updatedAt||0)+1);localSave();pulling=false;await push();return}
      adoptRemote(remote);
    }
    else if(remote&&!newer&&rL<0.6*rR&&rR-rL>=5){
      if(confirm(`This device has much LESS data than the Google Sheet (skills, leave, jobs).\n\nOK = load the Sheet's data onto this device (recommended)\nCancel = keep this device and send it to the Sheet`)){adoptRemote(remote)}
      else{pulling=false;await push();return}

    else if(newer){adoptRemote(remote)}

/* ---------- New work ---------- */
function projStatus(p){
  if(p.done)return {cls:'done',label:'Done'};
  if(TODAY<p.from)return {cls:'plan',label:'Planned'};
  if(TODAY<=p.to)return {cls:'prog',label:'In progress'};
  return {cls:'past',label:'Ended — mark done?'};
}
/* Add a person to a team, or swap one: available people first, then people from other teams.
   People with a skill the team is missing are marked and shown first. */
function pickRow(n,from,need,act){
  const sk=SKILLS.filter(s=>has(n,s.id)&&s.id!=='lead').map(s=>s.short), fills=need.filter(k=>has(n,k));
  return `<button class="prow" ${act}><span><b>${esc(dn(n))}</b>${isSup(n)?' <span class="sup">sup</span>':''}<em>${from}${sk.length?' · '+sk.slice(0,5).map(esc).join(', '):''}</em></span>${fills.length?`<i>has ${fills.map(k=>esc((SKILLS.find(s=>s.id===k)||{}).short||k)).join(', ')} ✓</i>`:''}</button>`;
}
function addToHtml(){
  const ctx={type:'day',date:cur}, teams=effTeams(cur), t=teams.find(x=>x.id===modal.team); if(!t)return '';

function swapHtml(){
  const teams=effTeams(cur), a=modal.name, A=teams.find(x=>people(x).includes(a)); if(!A)return '';

function swapPeople(a,b){
  const ctx={type:'day',date:cur}, teams=ctxTeams(ctx,true), A=teams.find(x=>people(x).includes(a)), B=teams.find(x=>people(x).includes(b));
  const put=(T,out,inn)=>{if(!T)return;if(T.leader===out)T.leader=inn;else T.members=T.members.map(m=>m===out?inn:m)};
  if(A&&B){learnManualMove(ctx,a,B.id);learnManualMove(ctx,b,A.id);put(A,a,'\u0000');put(B,b,a);put(A,'\u0000',b)}
  else if(A){learnManualMove(ctx,b,A.id);put(A,a,b)}
  save();
}

/* ---------- Report ---------- */
function monthData(ym){
  const [y,m]=ym.split('-').map(Number), last=new Date(y,m,0).getDate();
  const rows={}; S.staff.forEach(n=>rows[n]={worked:0,proj:0,lead:0,off:0,leave:0});
  let counted=0;
  for(let d=1;d<=last;d++){
    const s=`${ym}-${pad(d)}`; if(s>TODAY)break; if(isDayOff(s))continue;
    counted++;
    (dayRec(s).absent||[]).forEach(n=>{if(!rows[n])return;if(leaveOn(n,s))rows[n].leave++;else rows[n].off++});
    effTeams(s).forEach(t=>people(t).forEach(n=>{if(!rows[n])return;rows[n].worked++;if(isProj(t))rows[n].proj++;if(t.leader===n)rows[n].lead++}));
  }
  const ms=`${ym}-01`, me=`${ym}-${pad(last)}`;
  const jobs=S.projects.filter(p=>p.from<=me&&p.to>=ms).sort((a,b)=>a.from<b.from?-1:1).map(p=>{let n=0;for(let s=p.from>ms?p.from:ms;s<=(p.to<me?p.to:me);s=addDays(s,1))if(!isDayOff(s))n++;return {p,n}});
  return {rows,counted,jobs,label:`${MNL[m-1]} ${y}`,partial:TODAY<me&&TODAY>=ms,future:TODAY<ms};
}

});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='projform'){saveProj();return}
  if(e.target.id==='leaveform'){saveLeave();return}
  if(e.target.dataset.matchform){const old=e.target.dataset.matchform,full=e.target.querySelector('select').value;if(!full){toast('Choose the full name first');return}matchStaff(old,full);toast(`${dn(full)} is now ${full}`);render();return}
  if(e.target.id==='renameform'&&sel){const oldN=sel.name,v=$('rn-input').value.trim();
    if(!v||v===oldN){menuMode=null;renderMenu();return}
    if(S.staff.some(n=>n!==oldN&&n.toLowerCase()===v.toLowerCase())){toast(v+' is already on the list');return}
    renameStaff(oldN,v);sel=null;menuMode=null;toast(`Renamed to ${v}`);render();return}
  if(e.target.id==='addform'){const v=$('newname').value.trim().replace(/\s+/g,' ').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());if(!v)return;
    if(S.staff.some(n=>n.toLowerCase()===v.toLowerCase())){toast(v+' is already on the list');return}
    S.staff.push(v);save();toast(v+' added');render();const i=$('newname');if(i)i.focus()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(modal||sel||villaSel))closeAll()});
let drag=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest('.chip,.vchip');if(!c)return;drag=c.classList.contains('vchip')?{villa:c.dataset.villa}:{name:c.dataset.name,ctx:JSON.parse(c.dataset.ctx)};e.dataTransfer.setData('text/plain','x')});
document.addEventListener('dragover',e=>{const z=e.target.closest('[data-drop]');if(z&&drag){e.preventDefault();z.classList.add('drop')}});
document.addEventListener('dragleave',e=>{const z=e.target.closest('[data-drop]');if(z)z.classList.remove('drop')});
document.addEventListener('drop',e=>{const z=e.target.closest('[data-drop]');if(!z||!drag)return;e.preventDefault();
  const ctx=JSON.parse(z.dataset.ctx);
  if(drag.villa){const t=effTeams(cur).find(x=>x.id===z.dataset.drop);if(t&&!isProj(t)&&ctx.type==='day'){learnAreaMove(cur,drag.villa,t.id);const r=ensureDay(cur);r.villaMove=r.villaMove||{};r.villaMove[drag.villa]=t.id;save();toast('Villa moved for today')}}
  else if(sameCtx(ctx,drag.ctx)){if(!['absent','available'].includes(z.dataset.drop))learnManualMove(ctx,drag.name,z.dataset.drop);moveTo(ctx,drag.name,z.dataset.drop);toast(drag.name+' moved')}
  drag=null;sel=null;villaSel=null;render()});
async function copyText(txt,msg){
  try{await navigator.clipboard.writeText(txt);toast(msg)}
  catch(_){const ta=document.createElement('textarea');ta.value=txt;ta.className='textin';ta.style.cssText='position:fixed;inset:15% 16px auto;height:60%;z-index:90;width:calc(100% - 32px)';document.body.appendChild(ta);ta.select();toast('Select all and copy');ta.addEventListener('blur',()=>ta.remove())}
}
try{const b4=JSON.stringify(S.days);reconcileAll();if(JSON.stringify(S.days)!==b4)save();}catch(e){console.error(e)}
localSave();
render();
if(syncUrl())pull();

</script>

if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
